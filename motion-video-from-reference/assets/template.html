<!doctype html>
<meta charset="utf-8">
<title>Motion Video</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
/* Replace these tokens with the style system taken from the reference and the product's brand. */
:root{
  --ground:#ffffff; --ink:#0c1110; --tint:#f1f3f2; --brand:#e81a15; --accent:#03d8b3; --muted:#6c7773;
  --text:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d0c;overflow:hidden}
body{font-family:var(--text);color:var(--ink)}
/* The stage is the video frame. Change W and H here and in the script for other aspect ratios. */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ground);cursor:pointer}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scene{position:absolute;inset:0;opacity:0}
.ctr{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;text-align:center}
.ctr[data-s]{display:block}           /* split words need a block parent, flex would swallow the spaces */
.w{display:inline-block;will-change:transform}
.acc{color:var(--accent)} .brand{color:var(--brand)}
.wipe{position:absolute;top:-200px;left:-1920px;width:5760px;height:1480px;transform:translateX(-6200px) skewX(-12deg);z-index:50}

/* example scenes: delete and replace */
#s1 h1{top:430px;font-size:150px;font-weight:800;letter-spacing:-.04em}
#s2{background:var(--brand);color:#fff}
#s2 h1{top:380px;font-size:130px;font-weight:800;letter-spacing:-.04em}
#s2 .chip{top:640px}
#s2 .chip span{display:inline-block;padding:22px 44px;border-radius:999px;background:#fff;color:var(--ink);font-size:44px;font-weight:800}

/* player chrome (not part of the video; hidden with ?clean) */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font:600 13px/1 var(--text);color:#cfd6d3;background:linear-gradient(transparent,rgba(0,0,0,.72));opacity:0;transition:opacity .2s;z-index:99;font-variant-numeric:tabular-nums}
body:hover #ui,#ui:focus-within,body.paused #ui{opacity:1}
body.clean #ui{display:none} body.clean{cursor:none}
#ui button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:18px;cursor:pointer;flex:none}
#ui button:focus-visible,#ui input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#ui input{flex:1;min-width:0;accent-color:var(--brand)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.500v15a1 1 0 0 0 1.500.900l12-7.500a1 1 0 0 0 0-1.700l-12-7.500A1 1 0 0 0 7 4.500z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.500h3.500L12 5.500v13l-4.500-4H4zM15.500 9a4 4 0 0 1 0 6M18 6.500a7.500 7.500 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.500h3.500L12 5.500v13l-4.500-4H4zM16 9.500l5 5M21 9.500l-5 5"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
</svg>

<div id="stage">
  <!-- one <section class="scene"> per beat of the shot list -->
  <section class="scene" id="s1">
    <h1 class="ctr" data-s>Your first line here</h1>
  </section>
  <section class="scene" id="s2">
    <h1 class="ctr" data-s>Then the <span class="acc">answer</span></h1>
    <div class="ctr chip"><span>A supporting element</span></div>
  </section>
  <div class="wipe w1"></div>
</div>

<div id="ui">
  <button id="pp" type="button" aria-label="Play or pause"><svg class="ic"><use id="ppi" href="#i-pause"/></svg></button>
  <span id="clock">0:00</span>
  <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Timeline">
  <button id="snd" type="button" aria-label="Sound on or off"><svg class="ic"><use id="sndi" href="#i-mute"/></svg></button>
  <button id="fs" type="button" aria-label="Fullscreen"><svg class="ic"><use href="#i-full"/></svg></button>
</div>

<script>
const DUR = 8;                                  // video length in seconds
const W = 1920, H = 1080;                       // stage size, keep in step with #stage in the CSS
const AUDIO = {music: null, voice: null};       // e.g. {music: 'assets/music.mp3', voice: 'assets/voiceover.mp3'}
const SFX_GAIN = 2.6;                           // live level of the effects track against music and voice

const BACK = 'cubic-bezier(.34,1.56,.64,1)', EXPO = 'cubic-bezier(.16,1,.3,1)', INOUT = 'cubic-bezier(.7,0,.3,1)';
const $ = s => document.querySelector(s);
const $$ = s => typeof s === 'string' ? [...document.querySelectorAll(s)] : [s].flat();
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const anims = [], used = new WeakMap();

// Every animation is paused and driven by seek(), so the whole piece is scrubbable and frame-exact.
// The first animation on a property fills backwards (the element starts in its "from" state); later ones fill forwards.
function A(target, kf, start, dur, o = {}) {
  $$(target).forEach((el, i) => {
    const set = used.get(el) || new Set(), props = Object.keys(kf);
    const seen = props.some(p => set.has(p));
    props.forEach(p => set.add(p)); used.set(el, set);
    const a = el.animate(kf, {delay: (start + (o.stagger || 0) * i) * 1000, duration: dur * 1000,
      easing: o.ease || EXPO, fill: seen ? 'forwards' : 'both', iterations: o.iter || 1, direction: o.dir || 'normal'});
    a.pause(); anims.push(a);
  });
}
const pop   = (s, t, o = {}) => A(s, {opacity: [0, 1], transform: [`scale(.3) translateY(${o.y ?? 40}px)`, 'scale(1) translateY(0)']}, t, o.dur || .55, {ease: BACK, ...o});
const rise  = (s, t, o = {}) => A(s + ' .w', {opacity: [0, 1], transform: ['translateY(.45em)', 'translateY(0)'], filter: ['blur(14px)', 'none']}, t, o.dur || .6, {stagger: .07, ...o});
const out   = (s, t, o = {}) => A(s, {opacity: [1, 0], transform: ['translateY(0)', 'translateY(-70px)'], filter: ['none', 'blur(10px)']}, t, o.dur || .32, {ease: 'ease-in', ...o});
const fade  = (s, t, o = {}) => A(s, {opacity: [0, 1]}, t, o.dur || .4, o);
const float = (s, px, period, o = {}) => A(s, {translate: ['0 0', `0 ${px}px`]}, 0, period, {iter: Math.ceil(DUR / period), dir: 'alternate', ease: 'ease-in-out', ...o});
const show  = (s, from, to) => { if (from > 0) A(s, {opacity: [0, 1]}, from, .001); else A(s, {opacity: [1, 1]}, 0, .001); if (to < DUR) A(s, {opacity: [1, 0]}, to, .001); };
// a coloured panel sweeps across; switch scenes at t, its midpoint
function wipe(t, colour) { A('.w1', {transform: ['translateX(-6200px) skewX(-12deg)', 'translateX(6200px) skewX(-12deg)'], background: [colour, colour]}, t - .45, .9, {ease: INOUT}); }
// number ticker: one stacked span per value, each visible for its slot (parent needs display:inline-grid, spans grid-area:1/1)
function counter(sel, from, to, t, dur) {
  const el = $(sel), n = to - from + 1, slot = dur / n;
  for (let v = from; v <= to; v++) { const s = document.createElement('span'); s.textContent = v; el.append(s); }
  [...el.children].forEach((s, i) => { A(s, {opacity: [0, 1]}, t + i * slot, .001); if (i < n - 1) A(s, {opacity: [1, 0]}, t + (i + 1) * slot, .001); });
}
// wrap each word of [data-s] elements so lines can arrive word by word
function split() {
  $$('[data-s]').forEach(el => {
    const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (tw.nextNode()) nodes.push(tw.currentNode);
    nodes.forEach(n => {
      const f = document.createDocumentFragment();
      n.textContent.split(/(\s+)/).forEach(p => {
        if (!p) return;
        if (/^\s+$/.test(p)) { f.append(' '); return; }
        const s = document.createElement('span'); s.className = 'w'; s.textContent = p; f.append(s);
      });
      n.replaceWith(f);
    });
  });
}

// THE TIMELINE: one block per beat, in order, every time value here
function build() {
  split();
  // 1 · first line  0 → 4
  show('#s1', 0, 4);
  rise('#s1 h1', .3);
  out('#s1 h1', 3.5);
  // 2 · answer  4 → 8
  wipe(4, css('--brand')); show('#s2', 4, DUR);
  rise('#s2 h1', 4.3);
  pop('#s2 .chip span', 5.1);
  float('#s2 .chip span', -10, 1.4);
}

// SOUND EFFECTS: [time, kind, options], timed from the same numbers as the timeline above
function cues() {
  const c = [], add = (t, k, o) => c.push([t, k, o || {}]);
  add(.3, 'swish'); add(3.55, 'whoosh'); add(4.3, 'swish'); add(5.12, 'in'); add(5.3, 'chime', {v: .7});
  return c;
}
function schedule(ac) {
  const bus = ac.createGain(), comp = ac.createDynamicsCompressor(), rev = ac.createConvolver(), wet = ac.createGain();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .004; comp.release.value = .16;
  const irLen = Math.floor(ac.sampleRate * .7), ir = ac.createBuffer(2, irLen, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.2); }
  rev.buffer = ir; wet.gain.value = .11;
  bus.connect(comp).connect(ac.destination); bus.connect(wet).connect(rev).connect(ac.destination);
  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const to = pan => { if (!pan || !ac.createStereoPanner) return bus; const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(bus); return p; };
  const tone = (t, {f0, f1 = f0, dur, vol, att = .005, pan}) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * .8);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(to(pan)); o.start(t); o.stop(t + dur + .03);
  };
  const noise = (t, {f0, f1 = f0, dur, vol, q = .8, peak = .4, type = 'bandpass', pan}) => {
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = nb; n.loop = true; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + dur * peak); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    n.connect(f).connect(g).connect(to(pan)); n.start(t, (t * 7.3) % 1.5); n.stop(t + dur + .03);
  };
  // options: p = pitch multiplier, v = volume multiplier, pan = -1..1, f = frequency (note), down = falling whoosh
  const K = {
    in:     (t, o, p, v) => tone(t, {f0: 640 * p, f1: 410 * p, dur: .13, vol: .23 * v, pan: o.pan ?? -.2}),
    out:    (t, o, p, v) => tone(t, {f0: 430 * p, f1: 790 * p, dur: .12, vol: .22 * v, pan: o.pan ?? .2}),
    note:   (t, o, p, v) => { tone(t, {f0: o.f, f1: o.f * .975, dur: .22, vol: .17 * v, pan: o.pan}); tone(t, {f0: o.f * 2, dur: .07, vol: .03 * v, pan: o.pan}); },
    tick:   (t, o, p, v) => tone(t, {f0: 1900 * p, f1: 1500 * p, dur: .04, vol: .06 * v, att: .002}),
    key:    (t, o, p, v) => noise(t, {f0: 3000 * p, dur: .022, vol: .06 * v, q: 1.6, peak: .15}),
    swish:  (t, o, p, v) => noise(t, {f0: 1700, f1: 5200, dur: .3, vol: .045 * v, q: .7}),
    whoosh: (t, o, p, v) => noise(t, o.down ? {f0: 2600, f1: 260, dur: .65, vol: .1 * v, q: .7, peak: .35} : {f0: 240, f1: 2800, dur: .7, vol: .1 * v, q: .7, peak: .6}),
    thud:   (t, o, p, v) => { tone(t, {f0: 150, f1: 46, dur: .3, vol: .2 * v}); noise(t, {f0: 320, dur: .1, vol: .07 * v, type: 'lowpass', peak: .1}); },
    chime:  (t, o, p, v) => [1046.5, 1318.51, 1567.98, 2093].forEach((f, i) => tone(t + i * .055, {f0: f, dur: .95, vol: .075 * v, pan: -.3 + i * .2})),
    ding:   (t, o, p, v) => { tone(t, {f0: 880, dur: .3, vol: .1 * v}); tone(t + .09, {f0: 1318.51, dur: .42, vol: .1 * v}); },
    send:   (t, o, p, v) => { noise(t, {f0: 900, f1: 3800, dur: .17, vol: .06 * v, q: .9, peak: .5}); tone(t, {f0: 500, f1: 920, dur: .1, vol: .05 * v}); }
  };
  cues().forEach(([t, k, o]) => K[k](Math.max(0, t), o, o.p || 1, o.v || 1));
}
const renderSfx = (rate = 48000) => { const oc = new OfflineAudioContext(2, Math.round(rate * DUR), rate); schedule(oc); return oc.startRendering(); };
// used by scripts/audio.ps1: the same track as a 16-bit WAV, base64-encoded
async function sfxWav() {
  const b = await renderSfx(), n = b.length, L = b.getChannelData(0), R = b.getChannelData(1), u = new Uint8Array(44 + n * 4), d = new DataView(u.buffer);
  const str = (o, s) => [...s].forEach((ch, i) => u[o + i] = ch.charCodeAt(0));
  str(0, 'RIFF'); d.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 2, true);
  d.setUint32(24, b.sampleRate, true); d.setUint32(28, b.sampleRate * 4, true); d.setUint16(32, 4, true); d.setUint16(34, 16, true); str(36, 'data'); d.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { d.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); d.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
  let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
  return btoa(s);
}

// PLAYER
let actx = null, sfxBuf = null, src = null, sound = false, t = 0, playing = true, last = null;
const tracks = Object.values(AUDIO).filter(Boolean).map(u => { const a = new Audio(u); a.preload = 'auto'; return a; });
const stage = $('#stage'), scrub = $('#scrub'), clock = $('#clock'); scrub.max = DUR;
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
function syncAudio() {
  if (src) { try { src.stop(); } catch (e) {} src = null; }
  if (!sound || !playing) { tracks.forEach(a => a.pause()); return; }
  tracks.forEach(a => { try { a.currentTime = t; } catch (e) {} a.play().catch(() => {}); });
  if (!sfxBuf) return;
  const g = actx.createGain(); g.gain.value = SFX_GAIN; g.connect(actx.destination);
  src = actx.createBufferSource(); src.buffer = sfxBuf; src.connect(g); src.start(0, Math.min(t, sfxBuf.duration - .01));
}
async function setSound(on) {
  sound = on;
  if (on) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); await actx.resume(); sfxBuf = sfxBuf || await renderSfx(actx.sampleRate); } catch (e) { sound = false; } }
  $('#sndi').setAttribute('href', sound ? '#i-vol' : '#i-mute'); syncAudio();
}
function seek(v) { t = Math.max(0, Math.min(DUR - .001, v)); anims.forEach(a => a.currentTime = t * 1000); scrub.value = t; clock.textContent = `${mmss(t)} / ${mmss(DUR)}`; }
function setPlaying(p) { playing = p; document.body.classList.toggle('paused', !p); $('#ppi').setAttribute('href', p ? '#i-pause' : '#i-play'); syncAudio(); }
window.jump = v => { setPlaying(false); seek(v); };          // used by the renderer and for checking single frames
function fit() { const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
function tick(now) {
  if (playing && last != null) {
    const dt = (now - last) / 1000;
    let n = t + Math.min(.1, dt), resync = dt > .1;
    if (n >= DUR) { n = 0; resync = true; }
    seek(n); if (resync) syncAudio();
  }
  last = now; requestAnimationFrame(tick);
}
const fullscreen = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
$('#pp').onclick = () => setPlaying(!playing);
$('#fs').onclick = fullscreen;
$('#snd').onclick = () => setSound(!sound);
stage.onclick = () => setPlaying(!playing);
scrub.oninput = () => { setPlaying(false); seek(+scrub.value); };
// browsers only allow audio after a click or key press, so the first one anywhere switches sound on
const firstGesture = e => { removeEventListener('pointerdown', firstGesture, true); removeEventListener('keydown', firstGesture, true);
  if (!(e.target.closest && e.target.closest('#snd')) && !document.body.classList.contains('clean')) setSound(true); };
addEventListener('pointerdown', firstGesture, true); addEventListener('keydown', firstGesture, true);
addEventListener('keydown', e => {
  if (e.target === scrub) return;
  if (e.code === 'Space') { setPlaying(!playing); e.preventDefault(); }
  if (e.key === 'f') fullscreen();
  if (e.key === 'ArrowRight') { setPlaying(false); seek(t + 1 / 30); }
  if (e.key === 'ArrowLeft') { setPlaying(false); seek(t - 1 / 30); }
});

// layout is measured in build(), so wait for the real fonts first; list every face the page uses
const faces = ['500 17px "Plus Jakarta Sans"', '800 17px "Plus Jakarta Sans"'];
Promise.race([document.fonts ? Promise.all(faces.map(f => document.fonts.load(f))).catch(() => {}) : Promise.resolve(), new Promise(r => setTimeout(r, 2500))]).then(() => {
  build();
  const q = new URLSearchParams(location.search);
  if (q.has('clean')) document.body.classList.add('clean');
  if (q.has('t')) { setPlaying(false); seek(+q.get('t')); }
  else if (matchMedia('(prefers-reduced-motion: reduce)').matches) { setPlaying(false); seek(DUR * .9); }
  else seek(0);
  window.__ready = true;
  requestAnimationFrame(tick);
});
</script>
